<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflex7 - Elite Edition v0.6</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <div id="bg-overlay"></div> 

        <div id="stage">
            <div id="mode-selection">
                <h1 class="logo">Reflex7</h1>
                
                <div id="selection-content">
                    <div id="high-score-display">En Yüksek: Level <span id="best-level">0</span></div>
                    <p class="nickname-prompt">Sıralamaya girmek için takma adını gir ve hızını seç:</p>
                    
                    <div class="input-wrapper">
                        <label for="nickname-input">NICKNAME:</label>
                        <input type="text" id="nickname-input" placeholder="ÖR: ALFA-Z" maxlength="12">
                    </div>

                    <button class="mode-btn yavas" data-time="7.0">YAVAŞ (7sn)</button>
                    <button class="mode-btn hizli" data-time="4.0">HIZLI (4sn)</button>
                </div>
            </div>

            <div id="play-area">
                <div id="level-display">LEVEL: <span id="level-count">1</span></div>
                <div class="button-wrapper">
                    <svg class="timer-svg" viewBox="0 0 100 100">
                        <circle class="timer-background" cx="50" cy="50" r="48"></circle>
                        <circle id="timer-bar" cx="50" cy="50" r="48"></circle>
                    </svg>
                    <button id="main-button">
                        <div id="instruction">BAŞLA</div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="game-over-screen">
        <div class="stats-box">
            <h1>ELENDİN!</h1>
            <p id="fail-message">...</p>
            <div class="stats">
                <p>Level: <b id="final-level">0</b></p>
                <p>Süre: <b id="total-time">0</b>sn</p>
            </div>
            <button id="retry-button">Tekrar Dene</button>
        </div>
    </div>

    <div id="leaderboard-status-modal">
        <div class="modal-content">
            <span id="txt-global-success">SKORUNUZ KÜRESEL LİSTEYE MÜHÜRLENDİ!</span>
            <p id="final-score-details"></p>
            <p class="construction">Firebase entegrasyonu devam ediyor. Skorunuz Orca defterine kaydedildi.</p>
            <button id="close-modal-button">TAMAM</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
